name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # WHY: "24" matches the runner toolcache (24.22.2). check-latest stays
          # false and the actions/node-versions manifest also stops at 24.22.2,
          # so neither the cache nor the manifest installs the November 2026
          # patch. This floor stays on Node 24 and resolves 24.22.3 from
          # nodejs.org until the cache and manifest catch up.
          node-version: ">=24.22.3 <25"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, test, type-test, and build
        run: pnpm lint && pnpm test && pnpm run test:types && pnpm build

      - name: Publish Package
        run: npm publish --access public --ignore-scripts
